# Portal SSO deployment values for Infisical
# Deploy with: helm upgrade --install infisical-sso . -f values-portal-sso.yaml -n infisical-sso --create-namespace

infisical:
  name: infisical-sso
  replicaCount: 1
  image:
    repository: ghcr.io/dulyawatikp/infisical-sso
    tag: "379ef4ec45"
    pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ghcr-pull-secret
  extraEnv:
    - name: NODE_OPTIONS
      value: "--openssl-legacy-provider"
    - name: FIPS_ENABLED
      value: "false"
    - name: PORTAL_SSO_ENABLED
      value: "true"
    - name: PORTAL_SSO_NAVBAR_API_HOST
      value: "https://infisical.portal.ikp.rke2"
    - name: PORTAL_SSO_NAVBAR_API_PATH
      value: "/api/me"
    - name: PORTAL_SSO_KEYCLOAK_ISSUER
      value: "https://keycloak.portal.ikp.rke2/realms/SSO"
    - name: SITE_URL
      value: "https://infisical.portal.ikp.rke2"
    - name: HTTPS_ENABLED
      value: "true"
    - name: NODE_EXTRA_CA_CERTS
      value: "/etc/portal-ca/ca.crt"
  extraVolumeMounts:
    - name: portal-ikp-ca
      mountPath: /etc/portal-ca
      readOnly: true
  extraVolumes:
    - name: portal-ikp-ca
      secret:
        secretName: portal-ikp-ca
  service:
    type: NodePort
    nodePort: 30080

ingress:
  enabled: false
  hostName: infisical.portal.ikp.rke2
  nginx:
    enabled: false
  ingressClassName: nginx
  tls:
    - secretName: portal-tls
      hosts:
        - infisical.portal.ikp.rke2
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

postgresql:
  enabled: true
  name: postgresql
  fullnameOverride: postgresql-infisical-sso
  auth:
    username: infisical
    password: infisical-password
    database: infisical
  primary:
    persistence:
      enabled: false
      size: 10Gi

redis:
  enabled: true
  name: redis
  fullnameOverride: redis-infisical-sso
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
      size: 1Gi
